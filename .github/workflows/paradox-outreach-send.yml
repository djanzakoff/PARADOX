name: PARADOX - send 10 approved restaurant proposals

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type SEND-10 to send ten approved emails. Do not rerun after success."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: paradox-approved-outreach
  cancel-in-progress: false

jobs:
  send:
    if: ${{ inputs.confirmation == 'SEND-10' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate ten messages
        run: python scripts/paradox_outreach_validate.py
      - name: Send approved messages
        env:
          PARADOX_MAILRU_APP_PASSWORD: ${{ secrets.PARADOX_MAILRU_APP_PASSWORD }}
          PARADOX_CONFIRM_SEND: ${{ inputs.confirmation }}
        run: python scripts/paradox_outreach_send.py
